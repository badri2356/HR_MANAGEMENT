spring.application.name=AUTH-SERVICE
server.port=8081

# database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hr_management}
spring.datasource.username=${DB_USERNAME:postgres}
# CHANGED: no default; the real password comes only from the DB_PASSWORD environment variable
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# CHANGED: on locally, can be switched off when deployed
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# flyway migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.default-schema=public

# CHANGED: set ERROR_INCLUDE_MESSAGE=never when deployed
server.error.include-message=${ERROR_INCLUDE_MESSAGE:always}

# jwt configuration (no default: the secret comes only from the environment)
jwt.secret=${JWT_SECRET}
# Access token: 15 minutes (milliseconds)
jwt.access-token-expiration=900000
# Refresh token: 7 days (milliseconds)
jwt.refresh-token-expiration=604800000

# Where the reset link points (the frontend's reset page)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Email: only active when MAIL_HOST is set; otherwise the link is printed in the console
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true